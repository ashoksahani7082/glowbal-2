<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Connect With Us</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init','__PIXEL_ID__');fbq('track','PageView');
</script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=__PIXEL_ID__&ev=PageView&noscript=1"/></noscript>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Poppins,sans-serif;background:#070707;margin:0;overflow:hidden}
.bg-orb{position:absolute;border-radius:50%;filter:blur(140px);opacity:.45;z-index:0;animation:float 12s infinite ease-in-out alternate}
.orb-1{width:450px;height:450px;background:#24A1DE;top:-100px;left:-150px}.orb-2{width:500px;height:500px;background:#1976D2;bottom:-200px;right:-100px;animation-delay:-6s}
@keyframes float{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,80px) scale(1.15)}}
.glass-card{background:rgba(255,255,255,.03);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 40px rgba(0,0,0,.6);z-index:10}
.rotating-ring{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0%,transparent 40%,#24A1DE 100%);animation:rotate 2.5s linear infinite;z-index:1}.rotating-ring:after{content:'';position:absolute;inset:3px;background:#0f1115;border-radius:50%}
@keyframes rotate{100%{transform:rotate(360deg)}}@keyframes pulse-shadow{0%{box-shadow:0 0 0 0 rgba(36,161,222,.6)}70%{box-shadow:0 0 0 25px rgba(36,161,222,0)}100%{box-shadow:0 0 0 0 rgba(36,161,222,0)}}.btn-pulse{animation:pulse-shadow 2.5s infinite}.glow-text{text-shadow:0 2px 20px rgba(36,161,222,.4)}
</style></head>
<body class="min-h-screen flex items-center justify-center relative px-4">
<div class="bg-orb orb-1"></div><div class="bg-orb orb-2"></div>
<main class="w-full max-w-[420px] glass-card rounded-[2rem] p-8 relative flex flex-col items-center">
<div class="relative w-32 h-32 mb-6 mt-2 flex items-center justify-center"><div class="rotating-ring"></div><div class="relative z-10 w-[116px] h-[116px] bg-[#0f1115] rounded-full flex items-center justify-center"><i class="fa-brands fa-telegram text-[4.5rem] text-[#24A1DE]"></i></div></div>
<h1 class="text-[2rem] font-extrabold text-white mb-2 text-center glow-text tracking-wide leading-tight">Connect With Us</h1>
<p class="text-gray-300 font-medium text-sm mb-6">Join our official Telegram community</p>
<div class="flex items-center justify-center gap-5 w-full mb-8 text-sm font-semibold text-gray-200 bg-white/5 py-3 px-4 rounded-xl border border-white/10"><div class="flex items-center gap-2"><i class="fa-solid fa-shield-halved text-[#24A1DE]"></i><span>Official Channel</span></div><div class="w-[1px] h-5 bg-white/20"></div><div class="flex items-center gap-2"><i class="fa-solid fa-bolt text-[#24A1DE]"></i><span>Quick Access</span></div></div>
<a id="telegramButton" href="https://t.me/REPLACE_ME" target="_blank" rel="noopener noreferrer" class="w-full bg-[#24A1DE] hover:bg-[#1f8fc4] text-white font-extrabold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 transition-all duration-300 transform hover:-translate-y-1 btn-pulse"><i class="fa-brands fa-telegram-plane text-2xl"></i><span class="text-[15px] sm:text-base tracking-wider uppercase">JOIN TELEGRAM</span></a>
<p class="text-[10px] text-gray-400 mt-6 uppercase tracking-widest font-medium opacity-60"><i class="fa-solid fa-lock mr-1.5 text-[9px]"></i> Secure & Verified</p></main>
<script>
const b=document.getElementById('telegramButton'),fallback=b.href;
b.addEventListener('click',async e=>{e.preventDefault();const old=b.innerHTML;b.style.pointerEvents='none';b.innerHTML='<i class="fa-brands fa-telegram-plane text-2xl"></i><span>Preparing...</span>';
try{const p=new URLSearchParams(location.search);let rh=null;try{if(document.referrer)rh=new URL(document.referrer).hostname}catch{}
const r=await fetch('/api/create-invite',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:p.get('utm_source'),campaign:p.get('utm_campaign'),medium:p.get('utm_medium'),content:p.get('utm_content'),term:p.get('utm_term'),landing_referrer:rh,landing_url:location.href,fbp:document.cookie.match(/(?:^|; )_fbp=([^;]+)/)?.[1]||null,fbc:document.cookie.match(/(?:^|; )_fbc=([^;]+)/)?.[1]||null,user_agent:navigator.userAgent})});
const d=await r.json();if(!r.ok||!d.ok||!d.invite_link)throw new Error(d.error||'Invite creation failed');location.href=d.invite_link}catch(err){console.error(err);location.href=fallback;b.innerHTML=old;b.style.pointerEvents=''}});
</script></body></html>
